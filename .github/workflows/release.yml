name: Package QGIS plugin
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r CPT-City-Live-1.0.0.zip cpt_city_live -x "*/__pycache__/*" "*.pyc"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: CPT-City Live v1.0.0
          body: |
            First stable release of CPT-City Live for QGIS 3.22–3.x.

            Discovers the current cpt-city QGIS package dynamically, indexes newly published palettes, previews ramps, and installs selected ramps into QGIS Style Manager.
          files: CPT-City-Live-*.zip
