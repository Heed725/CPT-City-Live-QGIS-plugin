name: Package QGIS plugin
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r CPT-City-Live-1.0.1.zip cpt_city_live -x "*/__pycache__/*" "*.pyc"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: CPT-City Live v1.0.1
          body: |
            Performance update for CPT-City Live on QGIS 3.22–3.x.

            Palette previews are now rendered only for the selected row and broad result lists are bounded, preventing the interface from drawing thousands of gradients during startup.
          files: CPT-City-Live-*.zip
