name: Package QGIS plugin
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r CPT-City-Live-1.0.2.zip cpt_city_live -x "*/__pycache__/*" "*.pyc"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: CPT-City Live v1.0.2
          body: |
            Background-sync performance update for CPT-City Live on QGIS 3.22–3.x.

            Downloading and in-memory ZIP indexing now run on a worker thread, so QGIS remains responsive during the first catalogue build.
          files: CPT-City-Live-*.zip
