name: Package QGIS plugin
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build offline palette XML bundle
        run: python3 scripts/build_palette_bundle.py
      - name: Build plugin ZIP
        run: zip -r CPT-City-Offline-2.0.0.zip cpt_city_live -x "*/__pycache__/*" "*.pyc"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: CPT-City Offline Palette Installer v2.0.0
          body: |
            Offline palette installer for QGIS 3.22–3.x.

            The release ZIP already contains the cpt-city QGIS XML colours. Install the plugin, click Install, and use the ramps from QGIS Style Manager without downloading a catalogue.
          files: CPT-City-Offline-*.zip
