name: Package QGIS plugin
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build native CPT-City SVG catalog
        run: python3 scripts/build_palette_bundle.py
      - name: Build plugin ZIP
        run: zip -r CPT-City-New-Catalog-2.2.0.zip cpt_city_live -x "*/__pycache__/*" "*.pyc"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: CPT-City New Catalog v2.2.0
          body: |
            Separate cpt-city-new hierarchical catalog for QGIS 3.22–3.x.

            Includes a restoration action and Python script for returning to QGIS's original built-in CPT-City archive. Nothing is bulk-imported into Style Manager.
          files: CPT-City-New-Catalog-*.zip
